<html>
    <head> <b>Extra from <br>MBN </b><h3>MBN Ol/ul</h3>
    <!-- br useed for next line / extra space called as break -->
        <title>
             MBN Ol/ul
        </title>
    </head>
    <body>
        <p>
            <ol>   
                 <!-- this is ordered line -->
                 <li>one</li>
                 <li>two</li>  
                    <ol>
                        <li>extra</li>
                        <li>things</li>
                    </ol> 
                 <li>three</li>
            </ol>
            <!-- ul opend here for gaping the scequence  -->
             <ol>
                <p><br></p>. 
                <!-- for space we have to use br -->
             </ol>
            <ul> 
                <!-- this is unordered line -->
                <li>preet</li>
                <li>pratik</li>
                <!-- this part will show gap from the staring -->
                   <ol start="3"> 
                    <li>extra</li>
                    <li>brain</li>
                        <p></p>
                        <!-- used p for extra line -->
                   </ol><ol reversed start="3"> 
                    <li>extra</li>
                    <li>brain</li>

                   </ol>
                <li><b><i>hiii.         </i>omm.   </b>om</li>
            </ul>
            <!-- the ul closed here -->
        </p>
        <a>
    </body>
</html>
