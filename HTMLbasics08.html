<html>
    <head>
        <title>
                sub script & Superscript 
        </title>
    </head>
    <body>
        <header>
            this is subscript and superscript code output
        </header>
        <p>
                water is H<sub><u><b>3</b>3</u>2</sub> 0
        </p>
        <p>
                a<sup>2</sup> = b<sup><u>3</u>2</sup> + c<sup>2</sup>
        </p>
        <!-- here we can use u i b elements also for sup ans sub -->
    </body>
</html>
