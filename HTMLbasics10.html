<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmet.io</title>
</head>
<body>
    <p>
        <!-- Child parent tags -->
        <!-- p>ul>ol>li>li>p -->
         <p>
            <ul>
                <ol>
                    <li>
                        <li>
                            <p></p>
                        </li>
                    </li>
                </ol>
            </ul>
         </p>




        <ul>
            <!-- Siblings -->
            <!-- we can also write li*4 -->
            <!-- li+li+li+li siblings tag-->
            <li></li>
           <li></li>
           <li></li>
           <li></li>
        </ul>


        <!-- Multiplication -->
        <!-- we can also write ul>li*5 -->
        <ul>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </ul>



    </p>
    
</body>
</html>
