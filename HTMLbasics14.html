<body>
            <form action="/google.com">
                <label>
                    <!-- label is used to activate input box by clicking on Username -->
                        username
                <input type ="text" placeholder=" Enter username">

                </label>
                <br>
                password
                <input type ="password" placeholder=" Enter password"> <br>
                number
                <input type ="number" placeholder=" Enter number"><br>
                  time
                <input type ="time" placeholder=" Enter time"><br>
                colour
                <input type ="color" placeholder=" Enter color">




         <hr>




                       <!-- by using div we dont have to use br tag -->
                <div>
                      <!-- USing classical Approach in label  -->
                      <label for="username"> ENTER your username:</label>

                      <!--  -->
                </div>


                <div>
                      <!-- for password -->
                      <label for="password"> ENTER your password:</label>

                      <!--  -->
                </div>


                <!-- for age -->
                <div>
                    <label for="age"> ENTER your age:</label>

              <button type="submit">submit</button>
